<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia en la web</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Galería Multmedia</h1>
    <main class="galeria-flex">
<article class="tarjeta">
    <h2>Imagen</h2>
    <img src="multimedia/imagenes/cena-tematica.jpg" alt="Imagen de cena temática">
    <p>Cena temática institucional</p>
</article>
<article class="tarjeta">
    <h2>Audio</h2>
    <audio class="reproductor-audio" controls>
        <source src="multimedia/audios/gunsandroses-yesterday.mp3" type="audio/mpeg">Tu navegador no soporta el reproductor de audio.</audio>
    <p>Escucha nuestra pista</p>
</article>
<article class="tarjeta">
    <h2>Video</h2>
    <video controls>
        <source src="multimedia/videos/videococina.mp4" type="video/mp4">Tu navegador no soporta video.
    </video>
    <p>Receta paso a paso</p>
</article>
<article class="tarjeta">
    <h2>Documento</h2>
    <p>Propuesta en pdf</p>
    <a href="multimedia/documentos/palabras.pdf" target="_blank" class="btn-pdf">Ver pdf</a>
</article>
    </main>
    
</body>
</html>
